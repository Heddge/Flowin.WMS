services:
  postgres:
    image: postgres:18
    container_name: flowin-wms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - flowin_wms_data:/var/lib/postgresql

volumes:
  flowin_wms_data: